name: Test Core Windows

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compatibility:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / NumPy ${{ matrix.numpy }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Fixed x64 images also provide Python 3.9; macos-latest is ARM.
        os: [windows-2022]
        python: ['3.9', '3.10', '3.11', '3.12', '3.13']
        numpy: ['<2', '>=2']
        exclude:
          # Python 3.13 support starts with NumPy 2.1.
          - python: '3.13'
            numpy: '<2'
    env:
      PYPPBOX_DISABLE_FILE_LOG: '1'
      PYPPBOX_DISABLE_TERMINAL_LOG: '1'
      MPLBACKEND: Agg
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install test and build dependencies
        run: python -m pip install -r tests/requirements.txt "numpy${{ matrix.numpy }}" "setuptools>=67.8.0" wheel build
      - name: Test checkout
        run: python -m unittest discover -s tests -v
      - name: Build and install this checkout's wheel
        run: |
          python -m build --no-isolation --wheel --sdist
          python tests/check_distributions.py dist
          python -m pip install --no-deps dist/*.whl
      - name: Verify CPU and GPU face requirements resolve independently
        if: matrix.python == '3.11' && matrix.numpy == '>=2'
        run: python tests/check_face_dependencies.py dist/*.whl
      - name: Test installed wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import os,pathlib,pyppbox; p=pathlib.Path(pyppbox.__file__).resolve(); print(p); assert not p.is_relative_to(pathlib.Path(os.environ['GITHUB_WORKSPACE']).resolve()), 'Checkout shadowed the installed wheel'"
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v

  test_windows:
    name: Backend checks / Python ${{ matrix.python-version }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install requirements
      run: |
        python -m pip install --upgrade pip
        pip install "setuptools>=67.8.0"
        pip install wheel build
        cd requirements
        pip install -r requirements.txt
        pip freeze
    - name: Install pyppbox from this checkout
      run: python -m pip install --no-deps .
    - name: Install modules' data
      run: |
        pip install https://github.com/rathaumons/pyppbox-data/releases/download/v1.6.0/pyppbox_data_yolocls-1.6.0-py3-none-any.whl
        pip install https://github.com/rathaumons/pyppbox-data/releases/download/v1.6.0/pyppbox_data_yoloult-1.6.0-py3-none-any.whl
        pip install https://github.com/rathaumons/pyppbox-data/releases/download/v1.6.0/pyppbox_data_facenet-1.6.0-py3-none-any.whl
    - name: Prepare for tests
      run: |
        cd .github/test
        python prepare_tests.py
    - name: Test 01 - Basic
      run: |
        cd .github/test
        python test_01_basic.py
    - name: Test 02 - Evaluation and Result Tools
      run: |
        cd .github/test
        python test_02_eva_res.py
    - name: Test 03 - Evaluation Offline
      run: |
        cd .github/test
        python test_03_eva_offline.py
    - name: Test 04 - Detector GT (Ground-truth)
      run: |
        cd .github/test
        python test_04_dt_gt.py
    - name: Archive Results
      uses: actions/upload-artifact@v7
      with:
        name: githubtest-results-${{ matrix.python-version }}
        path: .github/test
