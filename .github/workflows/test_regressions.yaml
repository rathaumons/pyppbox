name: Bug fix regressions

on: [push, pull_request, workflow_dispatch]

jobs:
  regressions:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / NumPy ${{ matrix.numpy }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.9', '3.10', '3.11', '3.12']
        numpy: ['<2', '>=2']
    env:
      PYPPBOX_DISABLE_FILE_LOG: '1'
      PYPPBOX_DISABLE_TERMINAL_LOG: '1'
      MPLBACKEND: Agg
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test and build dependencies
        run: python -m pip install -r tests/requirements.txt "numpy${{ matrix.numpy }}" "setuptools>=67.8.0" wheel build
      - name: Test checkout
        run: python -m unittest discover -s tests -v
      - name: Build and install this checkout's wheel
        run: |
          python -m build --no-isolation --wheel --sdist
          python tests/check_distributions.py dist
          python -m pip install --no-deps dist/*.whl
      - name: Test installed wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python -c "import pyppbox; print(pyppbox.__file__)"
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
