name: RF-DETR CPU and GUI ownership

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: rfdetr-cpu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rfdetr_cpu:
    name: RF-DETR CPU / ${{ matrix.os }} / Python 3.11
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    env:
      BASELINE_REF: e41c68867e1a6b34780519f8a258d64218a3118e
      PYTHONDONTWRITEBYTECODE: '1'
      CUDA_VISIBLE_DEVICES: '-1'
      PYPPBOX_DISABLE_FILE_LOG: '1'
      PYPPBOX_DISABLE_TERMINAL_LOG: '1'
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            benchmarks/requirements-cpu.txt
            benchmarks/requirements-rfdetr-cpu.txt
      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libopengl0
      - name: Install CPU PyTorch (Linux and Windows)
        if: runner.os != 'macOS'
        run: python -m pip install torch==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install CPU PyTorch (macOS)
        if: runner.os == 'macOS'
        run: python -m pip install torch==2.5.1 torchvision==0.20.1
      - name: Install pinned qualification dependencies
        run: python -m pip install -r benchmarks/requirements-rfdetr-cpu.txt
      - name: Prepare runtime paths and record provenance
        run: |
          mkdir -p "$RUNNER_TEMP/rfdetr-results" "$RUNNER_TEMP/ultralytics" "$RUNNER_TEMP/pyppbox-runtime"
          python - <<'PY'
          import os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as output:
              for name,folder in (('YOLO_CONFIG_DIR','ultralytics'),('PYPPBOX_RUNTIME_DIR','pyppbox-runtime')):
                  output.write(f'{name}={root/folder}\n')
          PY
          git rev-parse HEAD > "$RUNNER_TEMP/rfdetr-results/candidate-ref.txt"
          python -m pip freeze > "$RUNNER_TEMP/rfdetr-results/dependencies.txt"
      - name: Build and install frozen and candidate wheels
        run: |
          git worktree add --detach "$RUNNER_TEMP/rfdetr-baseline-source" "$BASELINE_REF"
          python -m build --no-isolation --wheel --sdist --outdir "$RUNNER_TEMP/rfdetr-candidate-dist"
          python tests/check_distributions.py "$RUNNER_TEMP/rfdetr-candidate-dist"
          python -m build --no-isolation --wheel --outdir "$RUNNER_TEMP/rfdetr-baseline-dist" "$RUNNER_TEMP/rfdetr-baseline-source"
          python -m pip install --no-deps --target "$RUNNER_TEMP/rfdetr-baseline-wheel" "$RUNNER_TEMP"/rfdetr-baseline-dist/*.whl
          python -m pip install --no-deps --target "$RUNNER_TEMP/rfdetr-candidate-wheel" "$RUNNER_TEMP"/rfdetr-candidate-dist/*.whl
          python -c "import hashlib,json,os,pathlib; r=pathlib.Path(os.environ['RUNNER_TEMP']); print(json.dumps({str(p.relative_to(r)):hashlib.sha256(p.read_bytes()).hexdigest() for d in ('rfdetr-candidate-dist','rfdetr-baseline-dist') for p in (r/d).glob('*')},indent=2))" > "$RUNNER_TEMP/rfdetr-results/artifact-hashes.json"
      - name: Installed core, GUI, and real process cleanup tests
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/benchmarks/installed_checks.py" --package-root "$RUNNER_TEMP/rfdetr-candidate-wheel" --tests "$GITHUB_WORKSPACE/tests" 2>&1 | tee "$RUNNER_TEMP/rfdetr-results/installed-tests.log"
      - uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/rfdetr-assets
          key: rfdetr-assets-v1-${{ hashFiles('benchmarks/prepare_rfdetr_assets.py') }}
      - name: Prepare verified published weights and custom-head fixtures
        run: python benchmarks/prepare_rfdetr_assets.py --directory "$RUNNER_TEMP/rfdetr-assets" --video examples/data/gta.mp4
      - name: Compare all four variants and custom checkpoints offline
        working-directory: ${{ runner.temp }}
        run: python "$GITHUB_WORKSPACE/benchmarks/compare_rfdetr_cpu.py" --baseline-root "$RUNNER_TEMP/rfdetr-baseline-wheel" --candidate-root "$RUNNER_TEMP/rfdetr-candidate-wheel" --assets "$RUNNER_TEMP/rfdetr-assets/assets.json" --output "$RUNNER_TEMP/rfdetr-results" --baseline-ref "$BASELINE_REF" --candidate-ref "$(cat "$RUNNER_TEMP/rfdetr-results/candidate-ref.txt")"
      - name: Upload model and process validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rfdetr-cpu-${{ matrix.os }}
          path: ${{ runner.temp }}/rfdetr-results
          retention-days: 30
          if-no-files-found: warn
